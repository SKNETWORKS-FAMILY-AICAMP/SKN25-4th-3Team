services:
  # 1. PostgreSQL 데이터베이스 서비스
  db:
    image: postgres:15
    container_name: nangteol-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nangteol_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis 인메모리 저장소 서비스
  redis:
    image: redis:7-alpine
    container_name: nangteol-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Django 웹 애플리케이션 서비스
  web:
    build: .
    container_name: nangteol-web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - frontend_build:/app/recipes/static/recipes/dist

  # 4. React 프론트엔드 개발 서비스
  frontend:
    image: node:20-alpine
    container_name: nangteol-frontend
    working_dir: /app
    volumes:
      - ./recipes/frontend:/app
      - /app/node_modules
      - frontend_build:/static/recipes/dist
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: >
      sh -c "npm install && npm run build && npm run dev -- --host"
    depends_on:
      - web

  # 5. Airflow - DB 초기화 (경로 업데이트)
  airflow-init:
    image: apache/airflow:2.7.2
    container_name: nangteol-airflow-init
    depends_on:
      - db
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-nangteol_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${_AIRFLOW_WWW_USER_USERNAME:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    command: db init
    user: "${AIRFLOW_UID:-50000}:0"

  # 6. Airflow - 웹서버 (경로 업데이트)
  airflow-webserver:
    image: apache/airflow:2.7.2
    container_name: nangteol-airflow-webserver
    restart: always
    depends_on:
      - db
      - airflow-init
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-nangteol_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/nangteol:/opt/airflow/recipes
      - _PIP_ADDITIONAL_DEPENDENCIES=openai pymongo requests beautifulsoup4  # 필요한 패키지 자동 설치
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/nangteol
      - ./recipes:/opt/airflow/recipes
    command: webserver
    user: "${AIRFLOW_UID:-50000}:0"

  # 7. Airflow - 스케줄러 (경로 업데이트)
  airflow-scheduler:
    image: apache/airflow:2.7.2
    container_name: nangteol-airflow-scheduler
    restart: always
    depends_on:
      - db
      - airflow-init
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-nangteol_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/nangteol:/opt/airflow/recipes  # 파이썬 경로 추가
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/nangteol  # 프로젝트 루트 연결
      - ./recipes:/opt/airflow/recipes
    command: scheduler
    user: "${AIRFLOW_UID:-50000}:0"

volumes:
  postgres_data:
  frontend_build:
