services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nangteol-nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html
      - ./staticfiles:/app/staticfiles
    depends_on:
      frontend:
        condition: service_completed_successfully
      web:
        condition: service_started
      airflow-webserver:
        condition: service_started

  frontend:
    build:
      context: ./recipes/frontend
    container_name: nangteol-frontend
    restart: "no"
    volumes:
      - frontend_dist:/shared-dist

  db:
    image: postgres:15
    container_name: nangteol-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nangteol_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nangteol-redis
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: nangteol-web
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: nangteol.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn nangteol.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -"

  airflow-init:
    image: apache/airflow:2.7.2
    container_name: nangteol-airflow-init
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-nangteol_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__BASE_URL: http://${EC2_PUBLIC_HOST:-localhost}/airflow
      AIRFLOW__WEBSERVER__WEB_SERVER_URL_PREFIX: /airflow
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
      _PIP_ADDITIONAL_DEPENDENCIES: openai pymongo requests beautifulsoup4 python-dotenv
      PYTHONPATH: /opt/airflow/nangteol:/opt/airflow/recipes
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/nangteol
      - ./recipes:/opt/airflow/recipes
    command: >
      bash -c "airflow db migrate && (
               airflow users create
               --username $${_AIRFLOW_WWW_USER_USERNAME}
               --password $${_AIRFLOW_WWW_USER_PASSWORD}
               --firstname Admin
               --lastname User
               --role Admin
               --email admin@example.com || true
              )"
    user: "${AIRFLOW_UID:-50000}:0"

  airflow-webserver:
    image: apache/airflow:2.7.2
    container_name: nangteol-airflow-webserver
    restart: always
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-nangteol_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__BASE_URL: http://${EC2_PUBLIC_HOST:-localhost}/airflow
      AIRFLOW__WEBSERVER__WEB_SERVER_URL_PREFIX: /airflow
      PYTHONPATH: /opt/airflow/nangteol:/opt/airflow/recipes
      _PIP_ADDITIONAL_DEPENDENCIES: openai pymongo requests beautifulsoup4 python-dotenv
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/nangteol
      - ./recipes:/opt/airflow/recipes
    command: webserver
    user: "${AIRFLOW_UID:-50000}:0"

  airflow-scheduler:
    image: apache/airflow:2.7.2
    container_name: nangteol-airflow-scheduler
    restart: always
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-nangteol_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__BASE_URL: http://${EC2_PUBLIC_HOST:-localhost}/airflow
      AIRFLOW__WEBSERVER__WEB_SERVER_URL_PREFIX: /airflow
      PYTHONPATH: /opt/airflow/nangteol:/opt/airflow/recipes
      _PIP_ADDITIONAL_DEPENDENCIES: openai pymongo requests beautifulsoup4 python-dotenv
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/nangteol
      - ./recipes:/opt/airflow/recipes
    command: scheduler
    user: "${AIRFLOW_UID:-50000}:0"

volumes:
  postgres_data:
  frontend_dist:
